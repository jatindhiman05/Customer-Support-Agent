# VoltNest Knowledge Base Tags
# Version: 1.0.0
# Last updated: 2026-01-15
#
# This file defines the controlled vocabulary of tags used across the KB.
# Tags are attached to document chunks during ingestion and used for
# fine-grained retrieval filtering.
#
# Rules:
#   - Every tag has a canonical form (lowercase, underscores)
#   - Aliases map user/synonym terms to canonical tags
#   - Do NOT introduce synonyms — use aliases instead
#   - Every document should have 3-8 tags
#   - Every tag must be used by at least one document
#   - New tags require approval (see governance section at bottom)

version: "1.0.0"
schema_version: 1
last_updated: "2026-01-15"

# =============================================================================
# TAG CATEGORIES
# =============================================================================
# Tags are grouped into domains for organization. Domains are NOT used for
# filtering — only for human navigation.

domains:
  - name: order
    description: Tags related to orders, shipping, and delivery
  - name: payment
    description: Tags related to payment, refunds, and billing
  - name: product
    description: Tags related to products and product features
  - name: account
    description: Tags related to user accounts and security
  - name: policy
    description: Tags related to policies and rules
  - name: support
    description: Tags related to support operations
  - name: company
    description: Tags related to VoltNest the company
  - name: tech
    description: Tags related to technical concepts

# =============================================================================
# TAGS
# =============================================================================
# Each tag has:
#   - name: canonical form (used in metadata)
#   - display: how it's shown in UI
#   - domain: which domain it belongs to
#   - description: what it means
#   - aliases: alternate forms users might search for (mapped to canonical)
#   - used_in_categories: which KB categories apply this tag

