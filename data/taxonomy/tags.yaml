# =============================================================================
# TAG INDEX (reverse lookup)
# =============================================================================
# Maps aliases to canonical tag names. Built automatically at ingestion.

alias_index:
  # Example — generated from all aliases above
  # Note: This section is included for documentation. In production, it would
  # be generated programmatically from the tags list above.
  
  coupon: promo_code
  discount_code: promo_code
  voucher: promo_code
  promo: promo_code
  
  klarna: bnpl
  afterpay: bnpl
  installments: bnpl
  
  track: shipment_tracking
  tracking: shipment_tracking
  
  cancel_order: order_cancellation
  cancel: order_cancellation
  
  refund_request: refund
  money_back: refund
  
  forgot_password: password_reset
  reset_password: password_reset
  change_password: password_reset
  
  two_factor: two_factor_auth
  2fa: two_factor_auth
  mfa: two_factor_auth
  authenticator: two_factor_auth
  
  # ... (all other aliases mapped at ingestion time)

# =============================================================================
# TAG VALIDATION RULES
# =============================================================================

validation:
  rules:
    - name: max_tags_per_chunk
      value: 8
      description: No chunk should have more than 8 tags (avoid over-tagging)
    
    - name: min_tags_per_chunk
      value: 2
      description: No chunk should have fewer than 2 tags (avoid under-tagging)
    
    - name: canonical_form
      description: All tags must be lowercase with underscores. No spaces, no hyphens.
    
    - name: no_synonyms
      description: Never create a tag that duplicates an existing tag's meaning. Use aliases.
    
    - name: category_consistency
      description: A tag must be used by at least one document in a category that lists it in `used_in_categories`.
    
    - name: alias_uniqueness
      description: An alias can only map to one canonical tag.

# =============================================================================
# TAG STATISTICS
# =============================================================================

statistics:
  total_tags: 65
  total_aliases: 210
  tags_by_domain:
    order: 12
    payment: 10
    product: 13
    account: 8
    policy: 9
    support: 6
    company: 3
    tech: 4
  most_common_tags:
    - return_policy
    - refund
    - warranty_policy
    - shipment_tracking
    - bluetooth

# =============================================================================
# GOVERNANCE
# =============================================================================

governance:
  # Who can add or modify tags
  owner: knowledge_team
  approvers:
    - kb-owners@voltnest.com
    - taxonomy-owners@voltnest.com
  
  # Process for adding new tags
  add_tag_process:
    - step: 1
      action: Submit request to taxonomy-owners@voltnest.com
      required_info: [proposed_tag_name, domain, description, example_usage]
    - step: 2
      action: Review for duplicates against existing tags and aliases
    - step: 3
      action: Add to this file, bump version
    - step: 4
      action: Re-ingest KB to apply new tag
    - step: 5
      action: Update alias_index
  
  # Review cadence
  review_cycle_days: 90
  next_review_due: "2026-04-15"
  
  # Deprecation process
  deprecation:
    - step: 1
      action: Mark tag as deprecated (add `deprecated: true`)
    - step: 2
      action: Provide `deprecated_in_favor_of: <new_tag>`
    - step: 3
      action: Wait 1 review cycle
    - step: 4
      action: Remove tag and re-ingest
  
  change_log:
    - date: "2026-01-15"
      version: "1.0.0"
      changes: "Initial tag taxonomy with 65 tags across 8 domains"

# =============================================================================
# USAGE EXAMPLES
# =============================================================================
# These examples show how tags are applied during ingestion.

usage_examples:

  - document: "data/kb/policies/return_refund_policy.md"
    tags: [return_policy, refund, refund_timeline, return_shipping_cost, restocking_fee]

  - document: "data/kb/products/wireless_earbuds.md"
    tags: [wireless_earbuds, battery_life, waterproof, bluetooth, audio_quality, warranty_policy]

  - document: "data/kb/troubleshooting/bluetooth_pairing.md"
    tags: [bluetooth, wireless_earbuds, bluetooth_speaker, troubleshooting]

  - document: "data/kb/order_management/track_shipment_guide.md"
    tags: [shipment_tracking, carrier, order_status, delivery_time]

  - document: "data/kb/account/reset_password.md"
    tags: [password_reset, login_issue, account_security]

  - document: "data/kb/escalation/sensitive_topics.md"
    tags: [escalation, sensitive_legal, sensitive_safety, account_security]

# =============================================================================
# QUERY-TAG MAPPING
# =============================================================================
# When a user query matches certain patterns, prioritize these tags.

query_tag_patterns:

  - pattern: "waterproof|water resistant|can I swim|shower"
    tags: [waterproof]

  - pattern: "battery|charge|playback time"
    tags: [battery_life, charging]

  - pattern: "pair|bluetooth|connect"
    tags: [bluetooth]

  - pattern: "return|refund"
    tags: [return_policy, refund, refund_timeline]

  - pattern: "cancel"
    tags: [order_cancellation, cancellation_policy]

  - pattern: "track|where is my order|shipment"
    tags: [shipment_tracking, order_status]

  - pattern: "warranty|broken|defective"
    tags: [warranty_policy]

  - pattern: "price match|cheaper|competitor"
    tags: [price_match_policy]

  - pattern: "2fa|authenticator|two factor"
    tags: [two_factor_auth]

  - pattern: "password|login|sign in"
    tags: [password_reset, login_issue]

  - pattern: "gift card|gift certificate"
    tags: [gift_card]

  - pattern: "coupon|promo|discount"
    tags: [promo_code]

  - pattern: "customs|duty|vat|import"
    tags: [customs]

  - pattern: "return shipping|who pays"
    tags: [return_shipping_cost, return_policy]